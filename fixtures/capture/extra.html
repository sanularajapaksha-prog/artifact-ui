<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extra motion probe</title>
<script>const V=new URLSearchParams(location.search).get('v');if(V)document.documentElement.classList.add('v'+V);</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif}
section{padding:24px;border-bottom:1px solid #ddd}
.box{width:60px;height:60px;background:#0d9488;border-radius:8px}
@keyframes rv{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
#viewrev{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
#topview{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
.vc #viewrev,.vc #topview{animation-timeline:auto}
#ghover{cursor:pointer}
@keyframes mob{to{transform:translateX(20px)}}
@media (max-width:500px){#mobile{animation:mob 1s ease-in-out infinite alternate}}
.vb #mobile{animation-duration:2s}
@keyframes spin{to{transform:rotate(360deg)}}
#svgroot{animation:spin 2s linear infinite}
.vb #svgroot{animation-duration:4s}
#menu{transform:scale(0);transition:transform .2s;background:#0d9488;color:#fff;padding:8px;width:120px}
.vb #menu{background:#be123c}
.spacer{height:1600px}
</style></head><body>
<section id="s-top"><h2>Top</h2><div id="topview" class="box"></div></section>
<section id="s-hov"><h2>JS hover</h2><div id="ghover" class="box">gsap</div></section>
<section id="s-mob"><h2>Mobile only</h2><div id="mobile" class="box"></div></section>
<section id="s-svg"><h2>SVG root</h2><svg id="svgroot" width="40" height="40" viewBox="0 0 40 40"><rect x="10" y="10" width="20" height="20" fill="#0d9488"/></svg></section>
<section id="s-menu"><h2>Scaled to zero</h2><div id="menu">menu item</div></section>
<div class="spacer"></div>
<section id="s-view"><h2>View</h2><div id="viewrev" class="box"></div></section>
<div class="spacer"></div>
<script>
const vb=document.documentElement.classList.contains('vb');
const h=document.getElementById('ghover');
h.addEventListener('mouseenter',()=>gsap.to(h,{scale:1.3,duration:vb?0.8:0.4,ease:'power2.out'}));
h.addEventListener('mouseleave',()=>gsap.to(h,{scale:1,duration:0.4}));
</script>
</body></html>
