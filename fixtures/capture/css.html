<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS motion probe</title>
<script>if(new URLSearchParams(location.search).get('v')==='b')document.documentElement.classList.add('vb');</script>
<style>
:root{--bg:#ffffff;--fg:#111111;--accent:#2563eb}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0b;--fg:#eeeeee}}
.vb{--x:1}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
section{padding:24px;border-bottom:1px solid #ddd;min-height:120px}
.box{width:60px;height:60px;background:var(--accent);border-radius:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#loop{animation:spin 2s linear infinite}
.vb #loop{animation-duration:3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
#enter{animation:fadeUp .8s ease-out .2s both}
.vb #enter{animation-duration:1.2s}
#btn{background:#2563eb;color:#fff;border:0;padding:10px 16px;cursor:pointer;transition:background-color .2s ease}
#btn:hover{background:#1d4ed8}
.vb #btn:hover{background:#1e40af}
#slow{transition:transform 1.6s linear}
#slow:hover{transform:translateX(100px)}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#wiggle:hover{animation:wiggle .5s ease-in-out infinite}
#shimmer{position:relative;overflow:hidden;width:200px;height:40px;background:#e5e7eb}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sh 1.5s linear infinite}
.vb #shimmer::after{animation-duration:2.5s}
#ul{position:relative;color:var(--accent);text-decoration:none}
#ul::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:currentColor;transform:scaleX(0);transition:transform .3s}
#ul:hover::after{transform:scaleX(1)}
.vb #ul:hover::after{transform:scaleX(.5)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#svgcss circle{animation:pulse 1s ease-in-out infinite}
.vb #svgcss circle{animation-duration:2s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#progress{position:fixed;top:0;left:0;right:0;height:4px;background:var(--accent);transform-origin:0 50%;animation:grow linear both;animation-timeline:scroll(root)}
@keyframes grow2{from{transform:scaleX(0)}to{transform:scaleX(.5)}}
.vb #progress{animation-name:grow2}
@keyframes rv{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
#viewrev{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
.vb #viewrev{animation-range:entry 0% cover 20%}
#fadein{opacity:0;transition:opacity .6s ease}
.loaded #fadein{opacity:1}
.vb #fadein{transition-duration:.9s}
.spacer{height:1600px}
</style>
<style id="rm">@media (prefers-reduced-motion: reduce){#loop,#shimmer::after{animation:none}}</style>
<script>if(document.documentElement.classList.contains('vb'))document.getElementById('rm').remove();</script>
</head><body>
<div id="progress"></div>
<section id="s-loop"><h2>Keyframes loop</h2><div id="loop" class="box"></div><p id="rmflag">?</p></section>
<section id="s-enter"><h2>Entrance</h2><div id="enter" class="box"></div></section>
<section id="s-hover"><h2>Hover</h2><button id="btn">Hover me</button> <div id="slow" class="box">slow</div> <div id="wiggle" class="box">wig</div></section>
<section id="s-pseudo"><h2>Pseudo</h2><div id="shimmer"></div><p><a id="ul" href="#x">Underline link</a></p></section>
<section id="s-svg"><h2>SVG</h2>
<svg id="svgcss" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="#2563eb"/></svg>
<svg id="smil" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="8" fill="#2563eb"><animate id="smila" attributeName="r" values="4;16;4" dur="1s" repeatCount="indefinite"/></circle></svg>
<svg id="smil2" width="40" height="40" viewBox="0 0 40 40"><rect x="10" y="10" width="20" height="20" fill="#2563eb"><animateTransform id="smilt" attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="2s" repeatCount="indefinite"/></rect></svg>
</section>
<section id="s-load"><h2>Transition on load</h2><div id="fadein" class="box"></div></section>
<div class="spacer"></div>
<section id="s-view"><h2>View timeline</h2><div id="viewrev" class="box"></div></section>
<div class="spacer"></div>
<script>
const vb=document.documentElement.classList.contains('vb');
if(vb){document.getElementById('smila').setAttribute('dur','3s');document.getElementById('smilt').remove();}
document.getElementById('rmflag').textContent='reduce='+matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(()=>document.documentElement.classList.add('loaded'),100);
</script>
</body></html>
