<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loader probe</title>
<script>if(new URLSearchParams(location.search).get('v')==='b')document.documentElement.classList.add('vb');</script>
<style>
body{margin:0;font-family:system-ui,sans-serif}
main{padding:40px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0f172a;color:#fff;z-index:50}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:40px;height:40px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}
.vb .spinner{animation-duration:1.2s}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{width:160px;height:4px;background:#38bdf8;transform-origin:0 50%;animation:bar 1.5s ease-out both}
.overlay.done{opacity:0;transition:opacity .4s}
#hold[hidden]{display:none}
#toggle{position:fixed;right:16px;bottom:16px;z-index:100}
#cta{padding:10px 16px;background:#38bdf8;border:0;cursor:pointer}
#cta:hover{background:#0ea5e9}
</style></head><body>
<div id="pre-load" class="overlay"><div><div class="spinner" id="spin-load"></div><p>Loading (load event)</p></div></div>
<div id="pre-timer" class="overlay"><div><div class="spinner" id="spin-timer"></div><div class="bar" id="bar-timer"></div><p>Loading (timer)</p></div></div>
<div id="hold" class="overlay" hidden><div><div class="spinner" id="spin-hold"></div><div class="bar" id="bar-hold"></div><p>Loading (held)</p></div></div>
<button id="toggle" aria-pressed="false">Show loader</button>
<main id="page"><h1>Page behind the loaders</h1><p>Some body copy so the page has content behind the overlays.</p><button id="cta">Get started</button></main>
<script>
const T=+(new URLSearchParams(location.search).get('t')||2000);
addEventListener('load',()=>document.getElementById('pre-load').remove());
setTimeout(()=>{const el=document.getElementById('pre-timer');el.classList.add('done');setTimeout(()=>el.remove(),400);},T);
const tg=document.getElementById('toggle');const hold=document.getElementById('hold');
tg.addEventListener('click',()=>{const on=tg.getAttribute('aria-pressed')!=='true';tg.setAttribute('aria-pressed',String(on));hold.hidden=!on;});
</script>
</body></html>
